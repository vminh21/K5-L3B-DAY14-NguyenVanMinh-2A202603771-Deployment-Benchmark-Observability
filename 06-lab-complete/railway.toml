# Railway: build bằng Dockerfile, CMD đã lắng nghe theo $PORT do Railway cấp.
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên Railway dashboard / `railway variables`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
