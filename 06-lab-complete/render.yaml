# Render Blueprint: web service (Docker) + Key Value (Redis-compatible).
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: 06-lab-complete
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false            # nhập tay trên dashboard, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10"

  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []            # chỉ cho kết nối nội bộ
